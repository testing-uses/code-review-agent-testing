categories:
  correctness:
    weight: 28
    description: >
      Logic errors, incorrect edge-case handling, off-by-one errors,
      broken control flow, and incorrect state mutation.

  security:
    weight: 22
    description: >
      Injection risks, unsafe eval/exec, hardcoded secrets, unsafe
      file/path handling, and unvalidated input reaching sensitive operations.
    hard_gate: true
    hard_gate_severity: CRITICAL

  error_handling:
    weight: 11
    description: >
      Missing handling around risky operations, silent failures,
      unchecked None values, and invalid user input.

  maintainability_and_style:
    weight: 11
    description: >
      Naming consistency, function complexity, duplication, readability,
      and maintainability.

  documentation:
    weight: 6
    description: >
      Documentation for public functions and non-obvious logic.

  performance_and_resources:
    weight: 6
    description: >
      Unbounded loops, unnecessary expensive operations, resource leaks,
      and redundant computation.

  backward_compatibility:
    weight: 11
    description: >
      Breaking changes to existing function signatures, return types,
      or data shapes used elsewhere.
    hard_gate: true
    hard_gate_severity: HIGH

  architecture_consistency:
    weight: 5
    description: >
      Consistency with existing module boundaries and design patterns.

decision_thresholds:
  auto_approve_min_score: 90
  human_review_min_score: 60