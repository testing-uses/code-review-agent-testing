<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agentic AI Pipeline</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e7e9ee;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --ok: #35c26b;
    --warn: #e7b93a;
    --err: #ef5354;
  }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 860px; margin: 40px auto; padding: 0 16px;
    background: var(--bg); color: var(--text);
  }
  h1 { margin-bottom: 4px; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  textarea {
    width: 100%; box-sizing: border-box; font-family: "SFMono-Regular", Menlo, monospace;
    font-size: 14px; padding: 12px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 12px; padding: 9px 20px; cursor: pointer; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    font-size: 14px;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }

  #runStatusText { margin-top: 16px; font-weight: 500; font-size: 14px; }
  #runStatusText a { color: var(--accent); }

  .job-summary { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .job-pill {
    border: 1px solid var(--border); border-radius: 16px; padding: 4px 12px;
    font-size: 12px; color: var(--muted);
  }
  .job-pill.success { border-color: var(--ok); color: var(--ok); }
  .job-pill.failure { border-color: var(--err); color: var(--err); }
  .job-pill.in_progress { border-color: var(--warn); color: var(--warn); }

  #timeline { margin-top: 24px; border-left: 2px solid var(--border); padding-left: 22px; }
  .timeline-item { position: relative; margin-bottom: 20px; }
  .timeline-dot {
    position: absolute; left: -28px; top: 4px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 3px var(--bg);
  }
  .timeline-item.info .timeline-dot { background: var(--ok); }
  .timeline-item.warn .timeline-dot { background: var(--warn); }
  .timeline-item.error .timeline-dot { background: var(--err); }

  .timeline-title { font-weight: 600; font-size: 14px; display: flex; align-items: baseline; gap: 8px; }
  .timeline-item time { font-size: 11px; color: var(--muted); font-weight: 400; }
  .timeline-item .stage-tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px;
  }
  .timeline-item pre {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px; border-radius: 6px; font-size: 12px; overflow-x: auto;
    margin: 8px 0 0 0; max-height: 260px;
  }

  .past-runs { margin-top: 34px; }
  .past-runs h3 { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
  .run-card {
    border: 1px solid var(--border); background: var(--panel);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; font-size: 13px;
  }
  .run-card a { color: var(--accent); text-decoration: none; }
  .run-card a:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>Agentic AI Pipeline</h1>
<p class="subtitle">
  Submit a task. Dev Agent, Orchestrator, and Code Review Agent all run inside
  GitHub Actions — this avoids any local/org network restriction on reaching Groq.
</p>

<textarea id="taskText" rows="6" placeholder="create a function for overdue list"></textarea>
<br>
<button id="submitBtn">Submit Task</button>

<div id="runStatusText"></div>
<div id="jobSummary" class="job-summary"></div>
<div id="timeline"></div>

<div class="past-runs">
  <h3>Recent runs</h3>
  <div id="pastRuns"></div>
</div>

<script>
let activeRunId = null;
let pollHandle = null;

// Matches the ACTUAL [PIPELINE] events emitted by master_agent.py and
// reviewer.py — the previous version of this file had labels for events
// (received_task, repository_scanned, branch_created, completed, ...)
// that were never emitted by the backend, so almost everything fell
// through to the raw event-name fallback. Every key below is a real
// `emit()` call site.
const EVENT_LABELS = {
  task_received: "Task received",
  knowledge_base_checked: "Knowledge base checked",
  knowledge_base_context_analyzed: "Knowledge base context analyzed",
  dcba_allocated: "Token budget allocated (DCBA)",
  dev_agent_started: "Dev Agent started",
  dev_agent_finished: "Dev Agent finished",
  git_operations_started: "Committing changes",
  branch_pushed: "Branch pushed",
  pull_request_created: "Pull request created",
  code_review_started: "Code Review Agent started",
  review_files_identified: "Reviewable files identified",
  review_context_built: "Review context built",
  review_context_ready: "Review context ready",
  raw_findings_generated: "Findings generated",
  findings_verified: "Findings verified",
  breaking_change_detected: "Breaking change detected",
  review_decision_made: "Review decision made",
  review_posted_to_github: "Review posted to GitHub",
  code_review_finished: "Code Review Agent finished",
  human_approval_required: "Waiting on human approval",
  workflow_failed: "Workflow failed",
  summary_generated: "Summary generated",
  summary_generation_failed: "Summary generation failed",
  pipeline_finished: "Pipeline finished",
};

// Events that should render as a warning/error dot even though the
// backend doesn't send an explicit "level" field.
const ERROR_EVENTS = new Set(["workflow_failed", "summary_generation_failed"]);
const WARN_EVENTS = new Set(["breaking_change_detected", "human_approval_required"]);

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function eventTitle(event) {
  return EVENT_LABELS[event.event] || event.event;
}

function eventLevel(event) {
  if (event.level === "error" || ERROR_EVENTS.has(event.event)) return "error";
  if (event.level === "warn" || WARN_EVENTS.has(event.event)) return "warn";
  return "info";
}

function renderTimeline(events) {
  const timeline = document.getElementById("timeline");
  if (!events || events.length === 0) {
    timeline.innerHTML = "<p style='color:var(--muted);'>No pipeline events yet. Waiting on logs...</p>";
    return;
  }

  timeline.innerHTML = events.map(event => {
    const { event: name, timestamp, level, ...details } = event;
    const levelClass = eventLevel(event);
    const timeLabel = timestamp ? new Date(timestamp).toLocaleTimeString() : "";
    const detailsJson = Object.keys(details).length
      ? `<pre>${escapeHtml(JSON.stringify(details, null, 2))}</pre>`
      : "";

    return `
      <div class="timeline-item ${levelClass}">
        <div class="timeline-dot"></div>
        <div class="timeline-title">
          ${escapeHtml(eventTitle(event))}
          <span class="stage-tag">${escapeHtml(name)}</span>
          <time>${timeLabel}</time>
        </div>
        ${detailsJson}
      </div>
    `;
  }).join("");
}

function renderJobSummary(jobs) {
  const container = document.getElementById("jobSummary");
  if (!jobs || jobs.length === 0) {
    container.innerHTML = "";
    return;
  }
  container.innerHTML = jobs.map(job => {
    const cls = job.conclusion === "success" ? "success"
      : job.conclusion === "failure" ? "failure"
      : job.status === "in_progress" ? "in_progress" : "";
    return `<span class="job-pill ${cls}">${escapeHtml(job.name)}: ${job.status}${job.conclusion ? " (" + job.conclusion + ")" : ""}</span>`;
  }).join("");
}

async function pollStatus(runId) {
  try {
    const response = await fetch(`/status/${runId}`);
    const data = await response.json();

    if (data.error) {
      document.getElementById("runStatusText").textContent = `Error: ${data.error}`;
      return;
    }

    document.getElementById("runStatusText").innerHTML =
      `Status: <strong>${data.run.status}</strong> ${data.run.conclusion ? "(" + data.run.conclusion + ")" : ""} — ` +
      `<a href="${data.run.html_url}" target="_blank">View on GitHub</a>`;

    renderJobSummary(data.jobs);
    renderTimeline(data.events);

    if (data.run.status !== "completed") {
      pollHandle = setTimeout(() => pollStatus(runId), 3000);
    }
  } catch (err) {
    document.getElementById("runStatusText").textContent = `Polling error: ${err}`;
    pollHandle = setTimeout(() => pollStatus(runId), 5000);
  }
}

async function loadPastRuns() {
  const response = await fetch("/runs");
  const runsData = await response.json();
  const container = document.getElementById("pastRuns");

  if (runsData.error) {
    container.innerHTML = `<p>Error loading runs: ${escapeHtml(runsData.error)}</p>`;
    return;
  }

  container.innerHTML = runsData.map(run => `
    <div class="run-card">
      <div>Status: ${run.status} ${run.conclusion ? "(" + run.conclusion + ")" : ""}</div>
      <div>Started: ${run.created_at}</div>
      <a href="${run.html_url}" target="_blank">View on GitHub</a>
      &nbsp;|&nbsp;
      <a href="#" onclick="startPolling(${run.id}); return false;">Show timeline</a>
    </div>
  `).join("");
}

function startPolling(runId) {
  activeRunId = runId;
  if (pollHandle) clearTimeout(pollHandle);
  document.getElementById("timeline").innerHTML = "";
  pollStatus(runId);
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  const taskText = document.getElementById("taskText").value.trim();
  if (!taskText) return;

  document.getElementById("runStatusText").textContent = "Dispatching workflow...";
  document.getElementById("timeline").innerHTML = "";

  const response = await fetch("/trigger", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task_text: taskText }),
  });
  const data = await response.json();

  if (data.error) {
    document.getElementById("runStatusText").textContent = `Error: ${data.error}`;
    return;
  }

  document.getElementById("runStatusText").textContent = "Workflow dispatched. Locating run...";

  setTimeout(async () => {
    const runsResponse = await fetch("/runs");
    const runsData = await runsResponse.json();
    if (runsData.length > 0) {
      startPolling(runsData[0].id);
    }
    loadPastRuns();
  }, 4000);
});

loadPastRuns();
</script>

</body>
</html>
