<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agentic AI Pipeline</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 820px; margin: 40px auto; color: #1a1a1a; }
  h1 { margin-bottom: 4px; }
  .subtitle { color: #555; margin-bottom: 24px; }
  textarea { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 14px; padding: 10px; }
  button { margin-top: 12px; padding: 8px 18px; cursor: pointer; }
  #runStatusText { margin-top: 16px; font-weight: 500; }
  #timeline { margin-top: 20px; border-left: 2px solid #ddd; padding-left: 20px; }
  .timeline-item { position: relative; margin-bottom: 18px; }
  .timeline-dot { position: absolute; left: -27px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #999; }
  .timeline-item.info .timeline-dot { background: #2b8a3e; }
  .timeline-item.error .timeline-dot { background: #c92a2a; }
  .timeline-title { font-weight: 600; }
  .timeline-item time { font-size: 12px; color: #888; margin-left: 8px; }
  .timeline-item pre { background: #f6f6f6; padding: 8px; border-radius: 4px; font-size: 12px; overflow-x: auto; margin: 6px 0 0 0; }
  .job-summary { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .job-pill { border: 1px solid #ddd; border-radius: 16px; padding: 4px 12px; font-size: 13px; }
  .job-pill.success { border-color: #2b8a3e; color: #2b8a3e; }
  .job-pill.failure { border-color: #c92a2a; color: #c92a2a; }
  .past-runs { margin-top: 30px; }
  .run-card { border: 1px solid #eee; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
</style>
</head>
<body>

<h1>Agentic AI Pipeline</h1>
<p class="subtitle">
  Submit a task. Dev Agent, Orchestrator, and Code Review Agent all run inside
  GitHub Actions -- this avoids any local/org network restriction on reaching Groq.
</p>

<textarea id="taskText" rows="6" placeholder="create a function for overdue list"></textarea>
<br>
<button id="submitBtn">Submit Task</button>

<div id="runStatusText"></div>
<div id="jobSummary" class="job-summary"></div>
<div id="timeline"></div>

<div class="full-logs">
  <button id="toggleLogsBtn" type="button">Show full raw logs</button>
  <div id="fullLogs" style="display:none;"></div>
</div>

<div class="past-runs">
  <h3>Recent runs</h3>
  <div id="pastRuns"></div>
</div>

<script>
let activeRunId = null;
let pollHandle = null;

const EVENT_LABELS = {
  received_task: "Task received",
  repository_scanned: "Repository scanned",
  knowledge_base_built: "Knowledge base built",
  knowledge_base_retrieved: "Context retrieved",
  graph_context_built: "Graph context built",
  dcba_allocated: "Token budget allocated",
  dev_agent_started: "Dev Agent started",
  dev_agent_completed: "Dev Agent completed",
  branch_created: "Branch created",
  pull_request_created: "Pull request created",
  code_review_started: "Code Review Agent started",
  completed: "Pipeline completed"
};

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function eventTitle(event) {
  return EVENT_LABELS[event.event] || event.event;
}

function renderTimeline(events) {
  const timeline = document.getElementById("timeline");
  if (!events || events.length === 0) {
    timeline.innerHTML = "<p style='color:#888;'>No pipeline events yet. Waiting on logs...</p>";
    return;
  }

  timeline.innerHTML = events.map(event => {
    const { event: name, timestamp, level, ...details } = event;
    const levelClass = level === "error" ? "error" : "info";
    const timeLabel = timestamp ? new Date(timestamp).toLocaleTimeString() : "";
    const detailsJson = Object.keys(details).length
      ? `<pre>${escapeHtml(JSON.stringify(details, null, 2))}</pre>`
      : "";

    return `
      <div class="timeline-item ${levelClass}">
        <div class="timeline-dot"></div>
        <div class="timeline-title">${escapeHtml(eventTitle(event))}<time>${timeLabel}</time></div>
        ${detailsJson}
      </div>
    `;
  }).join("");
}

function renderFullLogs(logs) {
  const container = document.getElementById("fullLogs");
  if (!logs || logs.length === 0) {
    container.innerHTML = "<p style='color:var(--muted);'>No logs yet.</p>";
    return;
  }
  container.innerHTML = logs.map(job => `
    <div class="log-job-block">
      <h4>${escapeHtml(job.job_name)}</h4>
      <pre>${escapeHtml(job.lines.join("\n"))}</pre>
    </div>
  `).join("");
}

function renderJobSummary(jobs) {
  const container = document.getElementById("jobSummary");
  if (!jobs || jobs.length === 0) {
    container.innerHTML = "";
    return;
  }
  container.innerHTML = jobs.map(job => {
    const cls = job.conclusion === "success" ? "success" : job.conclusion === "failure" ? "failure" : "";
    return `<span class="job-pill ${cls}">${escapeHtml(job.name)}: ${job.status}${job.conclusion ? " (" + job.conclusion + ")" : ""}</span>`;
  }).join("");
}

async function pollStatus(runId) {
  try {
    const response = await fetch(`/status/${runId}`);
    const data = await response.json();

    if (data.error) {
      document.getElementById("runStatusText").textContent = `Error: ${data.error}`;
      return;
    }

    document.getElementById("runStatusText").innerHTML =
      `Status: <strong>${data.run.status}</strong> ${data.run.conclusion ? "(" + data.run.conclusion + ")" : ""} — ` +
      `<a href="${data.run.html_url}" target="_blank">View on GitHub</a>`;

    renderJobSummary(data.jobs);
    renderTimeline(data.events);
    renderFullLogs(data.logs);

    if (data.run.status !== "completed") {
      pollHandle = setTimeout(() => pollStatus(runId), 3000);
    }
  } catch (err) {
    document.getElementById("runStatusText").textContent = `Polling error: ${err}`;
    pollHandle = setTimeout(() => pollStatus(runId), 5000);
  }
}

async function loadPastRuns() {
  const response = await fetch("/runs");
  const runsData = await response.json();
  const container = document.getElementById("pastRuns");

  if (runsData.error) {
    container.innerHTML = `<p>Error loading runs: ${escapeHtml(runsData.error)}</p>`;
    return;
  }

  container.innerHTML = runsData.map(run => `
    <div class="run-card">
      <div>Status: ${run.status} ${run.conclusion ? "(" + run.conclusion + ")" : ""}</div>
      <div>Started: ${run.created_at}</div>
      <a href="${run.html_url}" target="_blank">View on GitHub</a>
      &nbsp;|&nbsp;
      <a href="#" onclick="startPolling(${run.id}); return false;">Show timeline</a>
    </div>
  `).join("");
}

function startPolling(runId) {
  activeRunId = runId;
  if (pollHandle) clearTimeout(pollHandle);
  document.getElementById("timeline").innerHTML = "";
  pollStatus(runId);
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  const taskText = document.getElementById("taskText").value.trim();
  if (!taskText) return;

  document.getElementById("runStatusText").textContent = "Dispatching workflow...";
  document.getElementById("timeline").innerHTML = "";

  const response = await fetch("/trigger", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task_text: taskText }),
  });
  const data = await response.json();

  if (data.error) {
    document.getElementById("runStatusText").textContent = `Error: ${data.error}`;
    return;
  }

  document.getElementById("runStatusText").textContent = "Workflow dispatched. Locating run...";

  setTimeout(async () => {
    const runsResponse = await fetch("/runs");
    const runsData = await runsResponse.json();
    if (runsData.length > 0) {
      startPolling(runsData[0].id);
    }
    loadPastRuns();
  }, 4000);
});

document.getElementById("toggleLogsBtn").addEventListener("click", () => {
  const panel = document.getElementById("fullLogs");
  const btn = document.getElementById("toggleLogsBtn");
  const showing = panel.style.display !== "none";
  panel.style.display = showing ? "none" : "block";
  btn.textContent = showing ? "Show full raw logs" : "Hide full raw logs";
});

loadPastRuns();
</script>

</body>
</html>
