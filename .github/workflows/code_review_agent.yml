name: Custom LLM Code Review Agent

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml PyGithub ruff bandit python-dotenv

      # context_builder.py now resolves symbol context from the SAME
      # central KB the Dev Agent uses (agents/knowledge_base/kb.sqlite3)
      # instead of its own separate repo_map.py cache. If this workflow
      # runs independently of master_agent.py's orchestrated flow (e.g. a
      # human pushes directly to a PR branch), the KB needs to exist and
      # be current, so build/update it here too -- build_or_update() only
      # re-parses files whose git blob SHA changed, so this is cheap when
      # the KB is already fresh from the Dev Agent Pipeline run.
      - name: Build/update knowledge base
        run: |
          python agents/knowledge_base/build_kb.py --repo-root . --db-path agents/knowledge_base/kb.sqlite3

      - name: Run review agent
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python agents/code_review_agent/run_review.py \
            --repo-root . \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --repo-full-name "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --db-path agents/knowledge_base/kb.sqlite3 \
            --model llama-3.3-70b-versatile